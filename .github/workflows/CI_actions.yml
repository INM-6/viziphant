# CI Tests that runs unittests and doc build
# Triggered on pull requests and pushes to master

name: tests
on:
  pull_request:
    branches: [master]
    types: [synchronize, opened, reopened]
  push:
    branches: [master]

jobs:
  docs:
       runs-on: "ubuntu-latest"
       env:
         PYTHON_VERSION: "3.10"
       strategy:
        fail-fast: false

       steps:
       - name: Get current year-month
         id: date
         run: echo "date=$(date +'%Y-%m')" >> "$GITHUB_OUTPUT"

       - uses: actions/checkout@v6

       - name: Set up Python ${{ env.PYTHON_VERSION }}
         uses: actions/setup-python@v6
         with:
            python-version: ${{ env.PYTHON_VERSION }}

       - name: Cache pip
         uses: actions/cache@v5
         with:
            path: ~/.cache/pip
            key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements-docs.txt') }}-${{ hashFiles('**/requirements.txt') }}-${{ steps.date.outputs.date }}

       - name: Install dependencies
         run: |
            sudo apt install pandoc
            python -m pip install --upgrade pip
            pip install .["docs"]
            # run notebooks
            sed -i -E "s/nbsphinx_execute *=.*/nbsphinx_execute = 'always'/g" doc/conf.py
       - name: make html
         run: |
            python --version
            cd doc
            make html

  tests:
       runs-on: ${{ matrix.os }}
       strategy:
        matrix:
          os: [ubuntu-latest]
          python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        fail-fast: false

       steps:

       - name: Get current year-month
         id: date
         run: echo "date=$(date +'%Y-%m')" >> "$GITHUB_OUTPUT"

       - uses: actions/checkout@v6

       - name: Set up Python ${{ matrix.python-version }}
         uses: actions/setup-python@v6
         with:
            python-version: ${{ matrix.python-version }}

       - name: Cache pip
         uses: actions/cache@v5
         with:
            path: ~/.cache/pip
            key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements-docs.txt') }}-${{ hashFiles('**/requirements.txt') }}-${{ steps.date.outputs.date }}

       - name: Install dependencies
         run: |
            python -m pip install --upgrade pip
            pip install .["tests"]

       - name: run tests
         run: |
            python --version
            pytest
